<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Management | Tamils Fashion</title>

   <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

    <div class="logo">
        <img th:src="@{/images/logo.png}" alt="Logo">
        <h2>Tamils Fashion</h2>
    </div>

    <ul>
        <li><a th:href="@{/dashboard}">🏠 Dashboard</a></li>
        <li><a th:href="@{/products}">👗 Product Management</a></li>
        <li><a th:href="@{/customers}">👤 Customer Management</a></li>
        <li><a th:href="@{/billing}">🧾 Billing</a></li>
        <li><a th:href="@{/billing/history}">📄 Bill History</a></li>
        <li><a th:href="@{/logout}">🚪 Logout</a></li>
    </ul>

</div>

<!-- Main Content -->

<div class="main-content">

    <div class="header">
        <h1>Customer Management</h1>
    </div>

    <!-- Customer Form -->

    <div class="form-container">

        <form th:action="@{/customers/save}" th:object="${customer}" method="post">

            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label>Customer Name</label>
                <input type="text"
                       class="form-control"
                       th:field="*{customerName}"
                       required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text"
                       class="form-control"
                       th:field="*{phone}"
                       required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email"
                       class="form-control"
                       th:field="*{email}">
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea class="form-control"
                          rows="3"
                          th:field="*{address}"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Save Customer
            </button>

        </form>

    </div>

    <!-- Search -->

    <form th:action="@{/customers/search}" method="get" class="search-box">

        <input type="text"
               name="keyword"
               placeholder="Search Customer">

        <button type="submit" class="btn btn-success">
            Search
        </button>

    </form>

    <!-- Customer Table -->

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Customer Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="customer : ${customers}">

            <td th:text="${customer.id}"></td>

            <td th:text="${customer.customerName}"></td>

            <td th:text="${customer.phone}"></td>

            <td th:text="${customer.email}"></td>

            <td th:text="${customer.address}"></td>

            <td>

                <a th:href="@{/customers/edit/{id}(id=${customer.id})}"
                   class="btn btn-warning">
                    Edit
                </a>

                <a th:href="@{/customers/delete/{id}(id=${customer.id})}"
                   class="btn btn-danger"
                   onclick="return confirm('Are you sure you want to delete this customer?')">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <div class="footer">
        <p>© 2026 Tamils Fashion Boutique Management System</p>
    </div>

</div>

</body>
</html>
