<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management | Tamils Fashion</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">

    <div class="logo">
        <img th:src="@{/images/logo.png}" alt="Logo">
        <h2>Tamils Fashion</h2>
    </div>

    <ul>
        <li><a th:href="@{/dashboard}">🏠 Dashboard</a></li>
        <li><a th:href="@{/products}">👗 Product Management</a></li>
        <li><a th:href="@{/customers}">👤 Customer Management</a></li>
        <li><a th:href="@{/billing}">🧾 Billing</a></li>
        <li><a th:href="@{/billing/history}">📄 Bill History</a></li>
        <li><a th:href="@{/logout}">🚪 Logout</a></li>
    </ul>

</div>

<!-- Main Content -->
<div class="main-content">

    <div class="header">
        <h1>Product Management</h1>
        <h3>Welcome Admin</h3>
    </div>

    <!-- Search -->
    <form th:action="@{/products/search}" method="get" class="search-box">

        <input type="text"
               name="keyword"
               class="form-control"
               placeholder="Search Product">

        <button type="submit" class="btn btn-primary">
            Search
        </button>

    </form>

    <!-- Product Form -->
    <div class="form-container">

        <form th:action="${product.id == null} ? @{/products/save} : @{/products/update}"
              th:object="${product}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label>Product Name</label>
                <input type="text" th:field="*{productName}" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Dress Type</label>
                <input type="text" th:field="*{dressType}" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Size</label>
                <input type="text" th:field="*{size}" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Color</label>
                <input type="text" th:field="*{color}" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Price</label>
                <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Stock</label>
                <input type="number" th:field="*{stock}" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}" class="form-control"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                <span th:text="${product.id == null} ? 'Save Product' : 'Update Product'"></span>
            </button>

        </form>

    </div>

    <!-- Product Table -->
    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Dress Type</th>
            <th>Size</th>
            <th>Color</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Description</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="p : ${products}">

            <td th:text="${p.id}"></td>
            <td th:text="${p.productName}"></td>
            <td th:text="${p.dressType}"></td>
            <td th:text="${p.size}"></td>
            <td th:text="${p.color}"></td>
            <td th:text="${p.price}"></td>
            <td th:text="${p.stock}"></td>
            <td th:text="${p.description}"></td>

            <td>

                <a class="btn btn-warning"
                   th:href="@{/products/edit/{id}(id=${p.id})}">
                    Edit
                </a>

                <a class="btn btn-danger"
                   th:href="@{/products/delete/{id}(id=${p.id})}"
                   onclick="return confirm('Delete this product?')">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
