<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Tamils Fashion</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="login-container">

    <img th:src="@{/images/logo.png}" alt="Tamils Fashion Logo">

    <h2>Admin Login</h2>

    <!-- Success Message -->
    <div th:if="${success}"
         style="color:green; text-align:center; margin-bottom:15px;">
        <span th:text="${success}"></span>
    </div>

    <!-- Login Error -->
    <div th:if="${param.error}"
         style="color:red; text-align:center; margin-bottom:15px;">
        Invalid Username or Password
    </div>

    <!-- Logout Message -->
    <div th:if="${param.logout}"
         style="color:green; text-align:center; margin-bottom:15px;">
        Logout Successful
    </div>

    <form th:action="@{/login}" method="post">

        <div class="form-group">
            <label>Username</label>
            <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter Username"
                    required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter Password"
                    required>
        </div>

        <button
                type="submit"
                class="btn btn-primary"
                style="width:100%;">
            Login
        </button>

    </form>

    <br>

    <div style="text-align:center;">

        <a th:href="@{/forgot-password}"
           style="text-decoration:none;color:#6A0DAD;font-weight:bold;">
            Forgot Password?
        </a>

        <br><br>

        <a th:href="@{/register}"
           style="text-decoration:none;color:#6A0DAD;font-weight:bold;">
            Create New Account
        </a>

    </div>

    <div class="footer">
        <p>&copy; 2026 Tamils Fashion Boutique</p>
    </div>

</div>

</body>

</html>
