<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Registration | Tamils Fashion</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="login-container">

    <img th:src="@{/images/logo.png}" alt="Logo">

    <h2>Admin Registration</h2>

    <!-- Success Message -->
    <div th:if="${success}"
         style="color:green; text-align:center; margin-bottom:15px;">
        <span th:text="${success}"></span>
    </div>

    <!-- Error Message -->
    <div th:if="${error}"
         style="color:red; text-align:center; margin-bottom:15px;">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/register}" th:object="${admin}" method="post">

        <div class="form-group">
            <label>Username</label>
            <input type="text"
                   th:field="*{username}"
                   class="form-control"
                   placeholder="Enter Username"
                   required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password"
                   th:field="*{password}"
                   class="form-control"
                   placeholder="Enter Password"
                   required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password"
                   name="confirmPassword"
                   class="form-control"
                   placeholder="Confirm Password"
                   required>
        </div>

        <button type="submit"
                class="btn btn-primary"
                style="width:100%;">
            Register
        </button>

    </form>

    <br>

    <div style="text-align:center;">

        <a th:href="@{/login}" style="text-decoration:none; color:#6A0DAD;">
            Already have an account? Login
        </a>

    </div>

    <div class="footer">
        <p>&copy; 2026 Tamils Fashion Boutique</p>
    </div>

</div>

</body>

</html>
