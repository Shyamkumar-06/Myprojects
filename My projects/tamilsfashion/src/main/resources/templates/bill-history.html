<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bill History | Tamils Fashion</title>

   <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

    <div class="logo">
        <img th:src="@{/images/logo.png}" alt="Logo">
        <h2>Tamils Fashion</h2>
    </div>

    <ul>
        <li><a th:href="@{/dashboard}">🏠 Dashboard</a></li>
        <li><a th:href="@{/products}">👗 Product Management</a></li>
        <li><a th:href="@{/customers}">👤 Customer Management</a></li>
        <li><a th:href="@{/billing}">🧾 Billing</a></li>
        <li><a th:href="@{/billing/history}">📄 Bill History</a></li>
        <li><a th:href="@{/logout}">🚪 Logout</a></li>
    </ul>

</div>

<!-- Main Content -->

<div class="main-content">

    <div class="header">
        <h1>Bill History</h1>
    </div>

    <table>

        <thead>

        <tr>
            <th>Bill ID</th>
            <th>Bill Number</th>
            <th>Bill Date</th>
            <th>Customer</th>
            <th>Total Amount</th>
            <th>Invoice</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="bill : ${bills}">

            <td th:text="${bill.id}"></td>

            <td th:text="${bill.billNumber}"></td>

            <td th:text="${#temporals.format(bill.billDate,'dd-MM-yyyy HH:mm')}"></td>

            <td th:text="${bill.customer.customerName}"></td>

            <td>
                ₹ <span th:text="${bill.totalAmount}"></span>
            </td>

            <td>

                <a th:href="@{/billing/invoice/{id}(id=${bill.id})}"
                   class="btn btn-success">
                    Download PDF
                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(bills)}">

            <td colspan="6" style="text-align:center;">
                No Bills Available
            </td>

        </tr>

        </tbody>

    </table>

    <div class="footer">
        <p>© 2026 Tamils Fashion Boutique Management System</p>
    </div>

</div>

</body>

</html>
